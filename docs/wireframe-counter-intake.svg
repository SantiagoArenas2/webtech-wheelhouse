<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <rect width="900" height="620" fill="#f5f5f5"/>
  <rect x="30" y="30" width="840" height="560" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <rect x="60" y="60" width="780" height="60" fill="#eaeaea" stroke="#333"/>
  <text x="100" y="100" font-family="Arial" font-size="28" font-weight="bold">Wheelhouse — Intake</text>
  <text x="650" y="100" font-family="Arial" font-size="20">Counter staff</text>

  <rect x="80" y="170" width="300" height="220" fill="#f3f4f6" stroke="#333"/>
  <text x="110" y="210" font-family="Arial" font-size="24" font-weight="bold">Customer</text>
  <line x1="110" y1="230" x2="330" y2="230" stroke="#333"/>
  <text x="110" y="270" font-family="Arial" font-size="18">Name</text>
  <rect x="110" y="280" width="200" height="24" fill="#fff" stroke="#333"/>
  <text x="110" y="335" font-family="Arial" font-size="18">Phone</text>
  <rect x="110" y="345" width="200" height="24" fill="#fff" stroke="#333"/>

  <rect x="420" y="170" width="360" height="220" fill="#f3f4f6" stroke="#333"/>
  <text x="450" y="210" font-family="Arial" font-size="24" font-weight="bold">Bike</text>
  <line x1="450" y1="230" x2="740" y2="230" stroke="#333"/>
  <text x="450" y="270" font-family="Arial" font-size="18">Make / model</text>
  <rect x="450" y="280" width="220" height="24" fill="#fff" stroke="#333"/>
  <text x="450" y="335" font-family="Arial" font-size="18">Serial no.</text>
  <rect x="450" y="345" width="220" height="24" fill="#fff" stroke="#333"/>
  <text x="450" y="400" font-family="Arial" font-size="18">Photo upload</text>
  <rect x="450" y="410" width="180" height="36" fill="#fff" stroke="#333"/>

  <rect x="80" y="440" width="700" height="75" fill="#e5e7eb" stroke="#333"/>
  <text x="105" y="480" font-family="Arial" font-size="20">Tag: customer name / phone / bike description</text>
  <rect x="620" y="455" width="120" height="40" fill="#d1d5db" stroke="#333"/>
  <text x="680" y="480" text-anchor="middle" font-family="Arial" font-size="18">Save</text>
</svg>
